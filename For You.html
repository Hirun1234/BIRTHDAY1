<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Manrope:wght@400;500&display=swap">
<style>
:root{--ink1:#0a1230;--ink2:#1b0f3a;--ink3:#3a1233;--gold:#ffd98a;--rose:#ff8fa3;--cream:#fff3d6;
--display:"Syne","Trebuchet MS",system-ui,sans-serif;--body:"Manrope","Segoe UI",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink1:#0a1230}}
:root[data-theme="dark"]{--ink1:#0a1230}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--ink1),var(--ink2) 55%,var(--ink3));color:var(--cream);font:400 1.05rem/1.55 var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1}
#intro{position:fixed;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;gap:1.1rem;text-align:center;transition:opacity .8s}
#intro.gone{opacity:0;pointer-events:none}
#intro p{margin:0;font:800 1.25rem var(--display)}#intro small{opacity:.7}
.ring{--p:0;width:136px;height:136px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1turn),rgba(255,255,255,.14) 0);cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.ring span{width:114px;height:114px;border-radius:50%;background:#14102e;display:grid;place-items:center;font-size:3.2rem;color:var(--rose);animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.12)}}
.cap{position:fixed;left:0;right:0;top:67%;z-index:5;padding:0 1.5rem;text-align:center;font:600 1.3rem/1.3 var(--display);opacity:0;transition:opacity .8s;pointer-events:none}
.cap.on{opacity:1}
.btn{border:0;border-radius:999px;padding:.8rem 1.6rem;background:linear-gradient(90deg,var(--gold),var(--rose));color:#2a0f2a;font:800 1rem var(--display);box-shadow:0 0 26px rgba(255,170,150,.5);cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--gold);color:var(--gold);box-shadow:none}
#open{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 2.2rem);transform:translateX(-50%);z-index:6;opacity:0;pointer-events:none;transition:opacity 1s}
#open.on{opacity:1;pointer-events:auto}
.card{position:fixed;left:.8rem;right:.8rem;bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);z-index:7;max-width:30rem;margin:0 auto;padding:1.3rem 1.2rem;text-align:center;background:rgba(20,12,46,.84);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,217,138,.45);border-radius:18px;transform:translateY(135%);transition:transform 1.1s cubic-bezier(.2,.9,.3,1)}
.card.show{transform:none}
.card p{margin:0}.gift{margin:.8rem 0!important;padding:.8rem;border:1.5px dashed var(--gold);border-radius:12px;color:var(--gold);font-weight:500}
.from{margin-bottom:.9rem!important;font:600 1.05rem var(--display)}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:9;padding:.4rem .9rem;border-radius:999px;border:1px solid var(--gold);background:rgba(20,12,46,.8);color:var(--gold);font:600 .8rem var(--display);cursor:pointer}
@media (prefers-reduced-motion:reduce){.ring span{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="intro">
  <div class="ring" id="ring" role="button" tabindex="0" aria-label="Press and hold to begin"><span>♥</span></div>
  <p id="hold"></p>
  <small>Turn your sound on 🔊</small>
</div>
<div class="cap" id="cap" aria-live="polite"></div>
<button class="btn" id="open" type="button">Open your gift 🎁</button>
<button id="snd" type="button" hidden>♪ ON</button>

<section class="card" id="card">
  <p id="msg"></p><p class="gift" id="gift"></p><p class="from" id="from"></p>
  <button class="btn ghost" id="again" type="button">Replay the surprise</button>
</section>

<script>
/* ✏️ EDIT HERE: her name stays hidden until the stars spell it */
var C = {
  name: "THENU",
  from: "Hirun",
  hold: "Press and hold to begin",
  line1: "I made this just for you.",
  line2: "Touch the stars. They move for you.",
  message: "Another year of you is the best thing that ever happened to my world. Happy birthday, my love.",
  gift: "Your gift: This is your gift."
};
var $ = function(i){ return document.getElementById(i); };
var cv = $("c"), cx = cv.getContext("2d"), dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0, CX = 0, SY = 0;
var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
function size(){ W = cv.width = Math.round(innerWidth * dpr); H = cv.height = Math.round(innerHeight * dpr); CX = W / 2; SY = H * .4; }
size(); addEventListener("resize", size);
$("msg").textContent = C.message; $("gift").textContent = C.gift; $("from").textContent = "— " + C.from; $("hold").textContent = C.hold;
document.addEventListener("contextmenu", function(e){ e.preventDefault(); });

/* particles */
var COL = ["#ffd98a", "#ffb86b", "#ff8fa3", "#ff6f91", "#c9a7ff", "#fff3d6"], N = 2600, P = [], G = COL.map(function(){ return []; });
for (var i = 0; i < N; i++) {
  var p = {x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, tx: 0, ty: 0, on: 0, glow: 0, s: (Math.random() * 1.6 + 1.5) * dpr};
  P.push(p); G[i % COL.length].push(p);
}
var beating = false, beatT = -1e4, ptr = {on: false, x: 0, y: 0};
function frame(t){
  cx.clearRect(0, 0, W, H); cx.globalCompositeOperation = "lighter";
  var k = beating ? 1 + .07 * Math.exp(-(t - beatT) / 170) : 1, R = 110 * dpr, R2 = R * R;
  for (var g = 0; g < G.length; g++) {
    cx.fillStyle = COL[g]; var a = G[g];
    for (var i = 0; i < a.length; i++) {
      var p = a[i];
      if (p.on) {
        p.vx = (p.vx + (CX + (p.tx - CX) * k - p.x) * .04) * .88;
        p.vy = (p.vy + (SY + (p.ty - SY) * k - p.y) * .04) * .88;
      } else {
        p.vx = (p.vx + (Math.random() - .5) * .1 * dpr + (CX - p.x) * .00004) * .985;
        p.vy = (p.vy + (Math.random() - .5) * .1 * dpr + (H / 2 - p.y) * .00004 + (p.glow > 0 ? .03 * dpr : 0)) * .985;
      }
      if (ptr.on) {
        var dx = p.x - ptr.x, dy = p.y - ptr.y, d2 = dx * dx + dy * dy;
        if (d2 < R2) { var d = Math.sqrt(d2) || 1, f = (1 - d / R) * 4 * dpr; p.vx += dx / d * f; p.vy += dy / d * f; }
      }
      p.x += p.vx; p.y += p.vy; if (p.glow > 0) p.glow -= .006;
      cx.globalAlpha = p.on ? .95 : .3 + Math.max(p.glow, 0) * .7;
      cx.fillRect(p.x, p.y, p.s, p.s);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function track(e){ ptr.x = e.clientX * dpr; ptr.y = e.clientY * dpr; ptr.on = true; }
addEventListener("pointermove", track); addEventListener("pointerdown", track);
addEventListener("pointerup", function(){ ptr.on = false; }); addEventListener("pointercancel", function(){ ptr.on = false; });

function setTargets(pts){
  pts.sort(function(){ return Math.random() - .5; });
  P.forEach(function(p, i){
    var t = pts[i];
    if (t) { p.tx = t[0]; p.ty = t[1]; p.on = 1; if (reduce) { p.x = p.tx; p.y = p.ty; } } else p.on = 0;
  });
}
function scatter(f){ P.forEach(function(p){ var a = Math.random() * 6.283, s = f * dpr * (.4 + Math.random()); p.vx += Math.cos(a) * s; p.vy += Math.sin(a) * s; }); }
function textPts(lines, frac, yc){
  var o = document.createElement("canvas"); o.width = W; o.height = H;
  var g = o.getContext("2d"), fs = W * frac;
  function f(){ g.font = "900 " + fs + "px 'Arial Black',Impact,'Helvetica Neue',sans-serif"; }
  f();
  while (Math.max.apply(null, lines.map(function(l){ return g.measureText(l).width; })) > W * .9) { fs *= .92; f(); }
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  var lh = fs * 1.05, y0 = H * yc - (lines.length - 1) * lh / 2;
  lines.forEach(function(l, i){ g.fillText(l, W / 2, y0 + i * lh); });
  var d = g.getImageData(0, 0, W, H).data, pts = [], st = Math.round(3 * dpr);
  for (var y = 0; y < H; y += st) for (var x = 0; x < W; x += st) if (d[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
  return pts;
}
function word(lines, frac, yc, note){ scatter(9); setTargets(textPts(lines, frac, yc)); if (note) ding(note, .14); }
function heart(){
  SY = H * .36; var S = Math.min(W, H * .6) * .3, pts = [], st = Math.round(3 * dpr);
  for (var y = SY - S * 1.4; y < SY + S * 1.4; y += st) for (var x = CX - S * 1.4; x < CX + S * 1.4; x += st) {
    var u = (x - CX) / S, v = -(y - SY) / S - .15, a = u * u + v * v - 1;
    if (a * a * a - u * u * v * v * v <= 0) pts.push([x, y]);
  }
  scatter(9); setTargets(pts);
}
function burst(x, y, n){
  for (var i = 0; i < n; i++) {
    var p = P[(Math.random() * N) | 0], a = Math.random() * 6.283, s = (Math.random() * 5 + 2) * dpr;
    p.on = 0; p.glow = 1; p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
  }
}

/* sound: soft generative instrumental + effects */
var AC, M, snd = true, nt = 0, st = 0, BEAT = 60 / 66 / 2;
var CH = [[48, 52, 55, 59], [45, 52, 55, 60], [41, 48, 52, 57], [43, 50, 52, 59]], ML = [76, 72, 69, 74], AR = [0, 1, 2, 3, 2, 1, 3, 2];
function fq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function tone(m, t, d, ty, v, a){
  var o = AC.createOscillator(), g = AC.createGain(); o.type = ty; o.frequency.value = fq(m);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(M); o.start(t); o.stop(t + d + .1);
}
function sched(){
  while (nt < AC.currentTime + .4) {
    var s = st % 32, bar = Math.floor(s / 8), c = CH[bar], k = s % 8;
    if (k === 0) { c.forEach(function(m){ tone(m, nt, 4.4, "triangle", .04, 1.2); }); tone(c[0] - 12, nt, 3.8, "sine", .12, .06); tone(ML[bar], nt, 2.8, "triangle", .06, .05); }
    tone(c[AR[k]] + 12, nt, 1.5, "sine", k % 2 ? .045 : .06, .015);
    nt += BEAT; st++;
  }
}
function audio(){
  if (AC) { AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)(); M = AC.createGain(); M.gain.value = .6;
    var d = AC.createDelay(1), fb = AC.createGain(), lp = AC.createBiquadFilter();
    d.delayTime.value = .45; fb.gain.value = .4; lp.type = "lowpass"; lp.frequency.value = 1600;
    M.connect(AC.destination); M.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(AC.destination);
    nt = AC.currentTime + .1; setInterval(sched, 120);
  } catch (e) { AC = null; }
}
function ding(m, v){ if (AC && snd) tone(m, AC.currentTime, 2.2, "sine", v || .12, .01); }
function chime(){ [72, 76, 79, 84].forEach(function(m, i){ setTimeout(function(){ ding(m, .09); }, i * 120); }); }
function thump(v){
  if (!AC || !snd) return;
  var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(40, t + .25);
  g.gain.setValueAtTime(v || .5, t); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .35);
}
function pop(){ thump(.22); ding([84, 88, 91, 96][(Math.random() * 4) | 0], .06); }
$("snd").onclick = function(){
  if (!AC) return;
  if (snd) { AC.suspend(); snd = false; } else { AC.resume(); snd = true; }
  this.textContent = snd ? "♪ ON" : "♪ OFF";
};

/* the show */
var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }, heartI = 0;
function cap(t){ var c = $("cap"); c.classList.remove("on"); if (t) setTimeout(function(){ c.textContent = t; c.classList.add("on"); }, 400); }
async function run(){
  $("card").classList.remove("show"); $("open").classList.remove("on"); cap("");
  beating = false; clearInterval(heartI);
  scatter(20); thump(); chime(); await sleep(1300);
  var nn = [72, 76, 79];
  for (var i = 0; i < 3; i++) { word([String(3 - i)], .6, .4, nn[i]); await sleep(1000); }
  word(["HAPPY", "BIRTHDAY"], .22, .4); chime(); await sleep(3400);
  word([C.name.toUpperCase()], .3, .4); chime(); await sleep(3600);
  heart(); beating = true; beatT = performance.now();
  heartI = setInterval(function(){ beatT = performance.now(); thump(); }, 850);
  await sleep(900); cap(C.line1); await sleep(3200); cap(C.line2); await sleep(3000);
  $("open").classList.add("on");
}
$("open").onclick = async function(){
  this.classList.remove("on"); clearInterval(heartI); beating = false; cap(""); setTargets([]);
  setTimeout(function(){ $("card").classList.add("show"); }, 1800);
  for (var i = 0; i < 9; i++) { burst(W * (.15 + Math.random() * .7), H * (.1 + Math.random() * .32), 300); pop(); await sleep(560); }
  await sleep(600); word(["I LOVE", "YOU"], .3, .2, 84); chime();
};
$("again").onclick = function(){ run(); };

/* press and hold to begin */
var ring = $("ring"), hRaf = 0, started = false, t0 = 0;
function hl(t){
  var p = Math.min((t - t0) / 1400, 1); ring.style.setProperty("--p", p);
  if (p >= 1) { hRaf = 0; begin(); return; }
  hRaf = requestAnimationFrame(hl);
}
function cancel(){ if (hRaf) { cancelAnimationFrame(hRaf); hRaf = 0; } if (!started) ring.style.setProperty("--p", 0); }
ring.addEventListener("pointerdown", function(e){
  e.preventDefault(); if (started) return; audio();
  try { navigator.vibrate(20); } catch (_) {}
  t0 = performance.now(); hRaf = requestAnimationFrame(hl);
});
["pointerup", "pointercancel", "pointerleave"].forEach(function(n){ ring.addEventListener(n, cancel); });
ring.addEventListener("keydown", function(e){ if ((e.key === "Enter" || e.key === " ") && !started) { e.preventDefault(); audio(); begin(); } });
function begin(){
  started = true; $("intro").classList.add("gone"); $("snd").hidden = false;
  try { navigator.vibrate([40, 60, 120]); } catch (_) {}
  run();
}
</script>
</body>
</html>
